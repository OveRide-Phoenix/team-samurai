name: team-samurai
services:
  postgres:
    image: public.ecr.aws/docker/library/postgres:18
    environment:
      POSTGRES_USER: samurai
      POSTGRES_DB: samurai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env}
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U samurai -d samurai"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres-data:
