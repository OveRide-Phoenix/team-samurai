name: ${SAMURAI_COMPOSE_PROJECT:-team-samurai}
services:
  postgres:
    image: public.ecr.aws/docker/library/postgres:18
    environment:
      POSTGRES_USER: samurai
      POSTGRES_DB: samurai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env}
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U samurai -d samurai"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: public.ecr.aws/docker/library/redis@sha256:2c2dff791878316e3b083188be0d578423b24813cdda5de0e80ea4f7b3e6bfd6
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-16379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres-data:
  redis-data:
