version: "3"

vars:
  COMPOSE: uv tool run --from podman-compose==1.6.0 podman-compose

tasks:
  default:
    desc: Start the Samurai backend and its local database
    cmds:
      - task: backend:dev

  setup:
    desc: Create missing private backend configuration and install locked Python dependencies
    preconditions:
      - sh: command -v uv >/dev/null
        msg: uv is required; install it before running task setup.
    cmds:
      - uv sync --locked --directory backend
      - uv run --directory backend python ../scripts/local_setup.py init-backend "{{.ROOT_DIR}}"
      - uv run --directory backend python ../scripts/local_setup.py validate "{{.ROOT_DIR}}"

  db:up:
    desc: Start only the Samurai PostgreSQL service and wait until it is healthy
    dotenv: [.env]
    deps: [_podman]
    preconditions:
      - sh: test -f .env
        msg: Run task setup before starting PostgreSQL.
    cmds:
      - "{{.COMPOSE}} up -d --wait --no-recreate postgres"

  db:status:
    desc: Show the Samurai PostgreSQL service status
    dotenv: [.env]
    deps: [_podman]
    cmds:
      - "{{.COMPOSE}} ps"

  db:logs:
    desc: Follow logs for only the Samurai PostgreSQL service
    deps: [_podman]
    cmds:
      - |
          project="${SAMURAI_COMPOSE_PROJECT:-team-samurai}"
          podman logs --tail 100 --follow "${project}_postgres_1"

  db:stop:
    desc: Stop only the Samurai PostgreSQL service and preserve its data volume
    dotenv: [.env]
    deps: [_podman]
    cmds:
      - "{{.COMPOSE}} stop postgres"

  redis:up:
    desc: Start only the Samurai Redis coordination service and wait until it is healthy
    dotenv: [.env]
    deps: [_podman]
    preconditions:
      - sh: test -f .env
        msg: Run task setup before starting Redis.
      - sh: |
          project="${SAMURAI_COMPOSE_PROJECT:-team-samurai}"
          port="${REDIS_PORT:-16379}"
          podman ps --filter "name=${project}_redis_1" --quiet | grep -q . || uv run --directory backend python ../scripts/local_setup.py check-port "$port" redis
        msg: The configured Redis port is unavailable; stop the conflicting local service before starting Samurai Redis.
    cmds:
      - "{{.COMPOSE}} up -d --wait --no-recreate redis"

  redis:status:
    desc: Show the Samurai Redis coordination service status
    dotenv: [.env]
    deps: [_podman]
    cmds:
      - |
          project="${SAMURAI_COMPOSE_PROJECT:-team-samurai}"
          podman ps --filter "name=${project}_redis_1"

  redis:logs:
    desc: Follow logs for only the Samurai Redis coordination service
    dotenv: [.env]
    deps: [_podman]
    cmds:
      - "{{.COMPOSE}} logs --tail 100 --follow redis"

  redis:stop:
    desc: Stop only the Samurai Redis coordination service and preserve its data volume
    dotenv: [.env]
    deps: [_podman]
    cmds:
      - "{{.COMPOSE}} stop redis"

  backend:dev:
    desc: Start the Samurai backend in the foreground on port 8000
    cmds:
      - task: setup
      - uv run --directory backend python ../scripts/local_setup.py check-port 8000 backend
      - task: db:up
      - task: redis:up
      - uv run --directory backend uvicorn samurai.app:create_app --factory --app-dir src --host 127.0.0.1 --port 8000

  frontend:setup:
    desc: Install locked frontend dependencies
    preconditions:
      - sh: command -v npm >/dev/null
        msg: npm is required only for optional frontend development.
    cmds:
      - npm --prefix frontend ci

  frontend:dev:
    desc: Start the Samurai UI in the foreground on port 4173
    cmds:
      - task: frontend:setup
      - npm --prefix frontend run dev

  check:
    desc: Run backend and frontend static checks, tests, and builds
    cmds:
      - task: setup
      - uv run --directory backend ruff check src tests ../scripts/local_setup.py
      - uv run --directory backend ruff format --check src tests ../scripts/local_setup.py
      - uv run --directory backend basedpyright src tests ../scripts/local_setup.py
      - uv run --directory backend pytest
      - task: frontend:setup
      - npm --prefix frontend run check
      - npm --prefix frontend run build

  recovery:check:
    desc: Run provider-free recovery tests against an explicitly supplied disposable PostgreSQL target
    cmds:
      - test -n "${SAMURAI_TEST_DATABASE_URL:-}" || { echo "Set SAMURAI_TEST_DATABASE_URL to an isolated disposable PostgreSQL database before running recovery checks." >&2; exit 2; }
      - test -n "${REDIS_URL:-}" || { echo "Set REDIS_URL to the isolated Samurai Redis coordinator before running recovery checks." >&2; exit 2; }
      - task: _podman
      - uv run --directory backend pytest tests/test_recovery_postgres.py tests/test_queue_runtime.py tests/test_database_recovery.py

  health:
    desc: Check the local PostgreSQL, Redis, and running backend without a model call
    dotenv: [.env]
    deps: [_podman]
    cmds:
      - "{{.COMPOSE}} exec -T postgres pg_isready -U samurai -d samurai"
      - "{{.COMPOSE}} exec -T redis redis-cli ping | grep -qx PONG"
      - curl --fail --silent --show-error --max-time 10 http://127.0.0.1:8000/agentos/health >/dev/null
      - echo "Samurai PostgreSQL, Redis, and backend health checks passed."

  _podman:
    internal: true
    preconditions:
      - sh: command -v podman >/dev/null
        msg: Podman is required; install it before using database tasks.
      - sh: podman info >/dev/null 2>&1
        msg: Podman is unavailable; start the existing machine with `podman machine start`.
