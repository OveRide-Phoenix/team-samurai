name: Checks
on:
  push:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    container: python:3.14.5-slim-bookworm
    env:
      UV_PYTHON_DOWNLOADS: never
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e
        with:
          version: "3.48.0"
      - run: task --version
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.0"
          python-version: "3.14"
      - run: uv sync --locked
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run basedpyright
      - run: uv run pytest
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm run test:sites
      - run: npm run test:server
      - run: bash ../scripts/test-deploy-cloud-run.sh
      - run: bash ../scripts/test-prepare-cloud-run-queue.sh
  recovery:
    runs-on: ubuntu-latest
    container: python:3.14.5-slim-bookworm
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    env:
      UV_PYTHON_DOWNLOADS: never
      SAMURAI_TEST_DATABASE_URL: postgresql+psycopg://samurai:samurai-test@postgres:5432/samurai
      REDIS_URL: redis://redis:6379/0
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: samurai
          POSTGRES_PASSWORD: samurai-test
          POSTGRES_DB: samurai
        options: >-
          --health-cmd "pg_isready -U samurai -d samurai"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis@sha256:9d317178eceac8454a2284a9e6df2466b93c745529947f0cd42a0fa9609d7005
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e
        with:
          version: "3.48.0"
      - run: task --version
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.0"
          python-version: "3.14"
      - run: uv sync --locked
      - run: uv run pytest tests/test_local_setup.py tests/test_recovery_postgres.py tests/test_queue_runtime.py tests/test_database_recovery.py tests/test_guest_access.py tests/test_founder_platform_migration.py tests/test_founder_platform_migration_atomic.py tests/test_founder_platform_migration_cli.py
